name: Craft Workspace checks

on:
  push:
    branches: [craft-workspace]
    paths:
      - "craft-workspace/**"
      - ".github/workflows/craft-workspace-check.yml"
  pull_request:
    paths:
      - "craft-workspace/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: craft-workspace
    steps:
      - name: Check out workspace branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
