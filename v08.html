function tree(x,z,s=1){const g=new THREE.Group();meshBox(g,[0,1.6,0],[.35,3.2,.35],0x3b2a24);const c=new THREE.Mesh(new THREE.ConeGeometry(1.4*s,3*s,9),mat(0x17443d));c.position.y=4.05*s;g.add(c);const c2=c.clone();c2.scale.set(.72,.72,.72);c2.position.y=5.5*s;g.add(c2);scene.add(g)}
function buildSettlement(){meshBox(scene,[-16,1,-13],[8,2,6],0x324757);meshBox(scene,[-3,1,-15],[5,2,4],0x2b4150);meshBox(scene,[12,1,-10],[7,2.5,6],0x3a4f60);meshBox(scene,[14,1,8],[5,2,5],0x37485a);for(let i=-30;i<=30;i+=7){tree(i,-24+Math.sin(i)*3,.9);tree(i,24+Math.cos(i)*3,.8)}for(let i=0;i<12;i++){const x=Math.sin(i*1.8)*18,z=Math.cos(i*1.7)*18;const c=new THREE.Mesh(new THREE.OctahedronGeometry(.7,0),mat(i%2?0x6a76ff:0x54e4cf,.45,.22));c.position.set(x,.9,z);scene.add(c)}const gate=new THREE.Group();gate.position.set(0,0,22);meshBox(gate,[-2,2,0],[.55,4,.55],0x616a73);meshBox(gate,[2,2,0],[.55,4,.55],0x616a73);const ring=new THREE.Mesh(new THREE.TorusGeometry(1.55,.12,12,40),mat(0xffcb70,.35,.5));ring.rotation.x=Math.PI/2;ring.position.y=2;gate.add(ring);scene.add(gate);portal=ring;}
function makeEnemy(x,z,kind='stalker'){const h=humanoid(kind==='warden'?0x812f52:0x5a334d,kind==='warden'?0xffb05e:0xd0536f);h.g.position.set(x,0,z);h.g.scale.setScalar(kind==='warden'?1.55:1);h.g.userData={hp:kind==='warden'?420:70,maxHp:kind==='warden'?420:70,kind};scene.add(h.g);enemies.push(h.g);if(kind==='warden')boss=h.g}
function loadRemoteCharacter(){return new Promise(resolve=>{const loader=new GLTFLoader();loader.load('https://raw.githubusercontent.com/programasweights/avatar/main/public/assets/character.glb',g=>{const model=g.scene;model.scale.setScalar(.85);model.position.y=0;heroRoot=new THREE.Group();heroRoot.add(model);hero= model;scene.add(heroRoot);resolve(true)},()=>resolve(false))})}
function fallbackHero(){const o=origins[state.origin]||origins.Wanderer;const h=humanoid(o.tint,0xe8f2ff);heroRoot=new THREE.Group();hero=h.g;heroRoot.add(hero);heroRoot.position.set(0,0,12);scene.add(heroRoot);return h}
async function startWorld(){bootScreen();scene=new THREE.Scene();scene.background=new THREE.Color(0x07151f);scene.fog=new THREE.Fog(0x07151f,24,100);scene.add(new THREE.HemisphereLight(0xa8c8ff,0x18252c,1.35));const sun=new THREE.DirectionalLight(0xffefcf,2.5);sun.position.set(18,28,11);sun.castShadow=true;scene.add(sun);terrain();buildSettlement();for(let i=0;i<5;i++)makeEnemy((i-2)*7,-5-i*2);makeEnemy(-17,-17,'warden');let loaded=await loadRemoteCharacter();if(!loaded)fallbackHero();camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,220);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$('world').appendChild(renderer.domElement);window.addEventListener('resize',resize);wireInput();connect();updateObjective();ui();animate()}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function wireInput(){addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key==='Tab'){e.preventDefault();open('system')}if(e.key===' '){e.preventDefault();attack() }if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));$('attackBtn').onclick=attack;$('runBtn').onpointerdown=()=>sprint=true;$('runBtn').onpointerup=()=>sprint=false;$('stick').addEventListener('pointermove',e=>{if(e.buttons){const r=$('stick').getBoundingClientRect(),dx=(e.clientX-(r.left+r.width/2))/48,dy=(e.clientY-(r.top+r.height/2))/48;keys.delete('w');keys.delete('s');keys.delete('a');keys.delete('d');if(Math.abs(dx)>.2)keys.add(dx>0?'d':'a');if(Math.abs(dy)>.2)keys.add(dy>0?'s':'w')}});renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;camYaw-=(e.clientX-lastX)*.005;lastX=e.clientX;lastY=e.clientY})}
function attack(){if(performance.now()<attackLock||!heroRoot)return;attackLock=performance.now()+420;const target=enemies.filter(e=>e.visible).sort((a,b)=>a.position.distanceTo(heroRoot.position)-b.position.distanceTo(heroRoot.position))[0];if(!target||target.position.distanceTo(heroRoot.position)>3.8)return;const dmg=12+(origins[state.origin]?.stats.str||5)*1.4;target.userData.hp-=dmg;state.st=Math.max(0,state.st-7);heroRoot.rotation.y+=.4;toast('IMPACT · '+Math.round(dmg));if(target.userData.hp<=0){if(target===boss){state.guardian=true;state.portal=true;state.authority+=3;state.title='Guardian-Breaker';gain(320);target.visible=false;toast('WARDEN DEFEATED · A ROUTE OPENS')}else{state.kills++;gain(35);target.position.set((Math.random()-.5)*44,0,(Math.random()-.5)*44);target.userData.hp=target.userData.maxHp}}save();ui()}
function interact(){if(!heroRoot)return;const x=heroRoot.position.x,z=heroRoot.position.z;if(Math.abs(x)<5&&z>19){state.ruinInvestigated=true;state.role=state.role==='Unchosen'?'Explorer':state.role;state.memory++;gain(40);toast('AERION GATE · SETTLEMENT TEMPLATE DISCOVERED')}else if(Math.abs(x+16)<5&&Math.abs(z+13)<5){open('missions');toast('THE OLD RUIN REMEMBERS')}else{toast('The world noticed your presence.')}}
function updateObjective(){if(!state.ruinInvestigated){$('objTitle').textContent='FIRST MOVEMENT';$('objText').textContent='Explore Aerion. Find the gate, market, shelter, notice board and wilderness edge.'}else if(!state.guardian){$('objTitle').textContent='THE OLD RUIN';$('objText').textContent='Investigate the ruin. A Guardian is awake. A rare decision waits below.'}else{$('objTitle').textContent='FIRST ROUTE';$('objText').textContent='The Guardian fell. Find the Transfer Point and decide what the next world should mean.'}}
function ai(dt){if(!heroRoot)return;for(const e of enemies){if(!e.visible)continue;const d=e.position.distanceTo(heroRoot.position);if(d<15){const v=new THREE.Vector3().subVectors(heroRoot.position,e.position).normalize();e.position.addScaledVector(v,dt*(e.userData.kind==='warden'?1.25:.75));e.lookAt(heroRoot.position.x,1.2,heroRoot.position.z);if(d<1.65&&Math.random()<dt*.75){state.hp=Math.max(0,state.hp-(e.userData.kind==='warden'?11:4));if(state.hp<=0){state.deaths++;state.hp=100;state.memory++;heroRoot.position.set(0,0,12);toast('YOU FELL · THE WORLD REMEMBERS')}}}}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(heroRoot){const dir=new THREE.Vector3((keys.has('d')?1:0)-(keys.has('a')?1:0),0,(keys.has('s')?1:0)-(keys.has('w')?1:0));const move=dir.lengthSq()>0;if(move){dir.normalize();const sp=(sprint||keys.has('shift'))?7.8:4.4;heroRoot.position.addScaledVector(dir,dt*sp);heroRoot.rotation.y=Math.atan2(dir.x,dir.z);state.st=Math.max(0,state.st-dt*(sp>6?6.5:1.4))}else state.st=Math.min(100,state.st+dt*4);if(hero){const t=clock.elapsedTime;hero.position.y=Math.sin(t*7)*(move?.055:.012);hero.rotation.x=attackLock>performance.now()-.25?-.08:0}camera.position.x+=(heroRoot.position.x+Math.sin(camYaw)*camDist-camera.position.x)*.1;camera.position.z+=(heroRoot.position.z+Math.cos(camYaw)*camDist-camera.position.z)*.1;camera.position.y+=((heroRoot.position.y+5.2)-camera.position.y)*.1;camera.lookAt(heroRoot.position.x,1.2,heroRoot.position.z);ai(dt);if(boss?.visible){$('bossbar').style.display=boss.position.distanceTo(heroRoot.position)<18?'block':'none';$('bossFill').style.width=Math.max(0,boss.userData.hp/boss.userData.maxHp*100)+'%'}else $('bossbar').style.display='none';state.weather=(clock.elapsedTime%55>39?'Dusk':'Clear');updateObjective();ui();renderer.render(scene,camera)}}
function renderRadar(){const r=$('radar');r.innerHTML='';const me=document.createElement('span');me.className='dot me';me.style.left='50%';me.style.top='50%';r.appendChild(me);for(const e of enemies){if(!e.visible)continue;const dx=e.position.x-heroRoot.position.x,dz=e.position.z-heroRoot.position.z;const el=document.createElement('span');el.className='dot '+(e===boss?'bossdot':'foe');el.style.left=(50+dx*1.6)+'%';el.style.top=(50+dz*1.6)+'%';r.appendChild(el)}const pt=document.createElement('span');pt.className='dot poi';pt.style.left=(50+(22-heroRoot.position.x)*1.2)+'%';pt.style.top=(50+(12-heroRoot.position.z)*1.2)+'%';r.appendChild(pt)}
async function connect(){channel.on('presence',{event:'sync'},()=>{peers.clear();Object.entries(channel.presenceState()).forEach(([k,v])=>peers.set(k,v));ui()}).on('presence',{event:'join'},()=>toast('Another traveler entered Aerion')).on('presence',{event:'leave'},()=>ui()).subscribe(async s=>{connected=s==='SUBSCRIBED';if(connected)await channel.track({name:state.name,origin:state.origin,level:state.level,world:'Aerion'});ui()})}
function open(id){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'));const e=$(id);if(e)e.classList.add('show');ui()};document.addEventListener('click',e=>{const b=e.target.closest('[data-open]'),c=e.target.closest('[data-close]');if(b)open(b.dataset.open);if(c)e.target.closest('.modal')?.classList.remove('show')});
$('upgrade').onclick=()=>{if(state.coins<50){toast('Not enough coins');return}state.coins-=50;state.weapon='Traveler Blade // Refined';state.authority++;save();ui();toast('NAMED ITEM REFORGED')};$('ration').onclick=()=>{const i=state.inventory.findIndex(x=>x.startsWith('Field Ration'));if(i<0){toast('No ration');return}state.hp=Math.min(100,state.hp+28);save();ui();toast('FIELD RATION USED')};
$('originGrid').classList.add('show');document.querySelectorAll('[data-origin]').forEach(b=>b.onclick=()=>{selectedOrigin=b.dataset.origin;document.querySelectorAll('[data-origin]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});
$('enterBtn').onclick=()=>{state.origin=selectedOrigin;state.race='Human';state.role='Unchosen';state.attrs=origins[selectedOrigin].stats;save();$('start').style.display='none';startWorld()};$('continueBtn').onclick=()=>{selectedOrigin=state.origin||'Wanderer';$('start').style.display='none';startWorld()};
</script>
