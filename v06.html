<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#02040a"><title>TRANSCENDENCE</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:#eef4ff;font-family:Inter,system-ui,sans-serif}body{touch-action:none}#cinema{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:#02040a;transition:opacity 900ms ease}.gone{opacity:0;pointer-events:none}.stars{position:absolute;inset:-10%;background:radial-gradient(circle at 20% 30%,#70ddff 0 1px,transparent 2px),radial-gradient(circle at 72% 20%,#fff 0 1px,transparent 2px),radial-gradient(circle at 44% 75%,#8f7cff 0 1px,transparent 2px),radial-gradient(circle at 85% 82%,#fff 0 1px,transparent 2px);background-size:31% 29%,41% 37%,53% 47%,61% 59%;opacity:.45;animation:drift 18s linear infinite}.rift{position:absolute;width:70vw;height:2px;background:linear-gradient(90deg,transparent,#69dcff,transparent);box-shadow:0 0 35px #69dcff99;transform:rotate(-15deg);animation:rift 5s ease-in-out infinite}.rift2{width:52vw;transform:rotate(18deg);animation-delay:1.4s;opacity:.35}.core{width:min(28vw,310px);height:min(28vw,310px);border-radius:50%;border:1px solid #69dcff55;box-shadow:0 0 90px #69dcff22 inset,0 0 100px #69dcff16;position:absolute}.core:before,.core:after{content:"";position:absolute;border:1px solid #69dcff33;border-radius:50%;inset:16%;animation:spin 12s linear infinite}.core:after{inset:33%;border-color:#ffbd6855;animation-direction:reverse}.card{position:relative;width:min(980px,86vw);padding:clamp(28px,5vw,58px);border-radius:28px;border:1px solid #69dcff2d;background:#07111ee8;backdrop-filter:blur(10px);box-shadow:0 50px 140px #000b;text-align:left}.eyebrow{color:#69dcff;letter-spacing:.24em;font-size:10px;text-transform:uppercase}.title{font-weight:950;font-size:clamp(52px,9vw,112px);letter-spacing:.13em;line-height:.9;margin:14px 0}.story{max-width:760px;min-height:84px;color:#e8eff8;font-size:clamp(17px,2.3vw,28px);line-height:1.4}.meta{display:flex;gap:13px;flex-wrap:wrap;color:#70839d;font-size:10px;letter-spacing:.12em}.actions{margin-top:25px;display:flex;gap:9px;flex-wrap:wrap}.actions button{padding:12px 16px;border-radius:11px;border:1px solid #89a4c533;background:#0c1828;color:#eef4ff;cursor:pointer}.actions .primary{border-color:#69dcff77}.skip{position:absolute;right:18px;bottom:16px;color:#647790;font-size:10px;letter-spacing:.12em}@keyframes drift{to{transform:translate3d(4%,3%,0) scale(1.05)}}@keyframes rift{0%,100%{transform:translateX(-10%) rotate(-15deg);opacity:.15}50%{transform:translateX(10%) rotate(-15deg);opacity:.75}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:760px){.card{width:calc(100vw - 26px);padding:24px 20px}.title{font-size:clamp(36px,12vw,64px);letter-spacing:.08em}.story{min-height:115px;font-size:18px}.actions{flex-direction:column}.actions button{width:100%}}
</style></head><body><div id="cinema"><div class="stars"></div><div class="rift"></div><div class="rift rift2"></div><div class="core"></div><main class="card"><div class="eyebrow">A LIVING MULTIVERSE ACTION RPG</div><div class="title">TRANSCENDENCE</div><div class="story" id="story">There are worlds no map has recorded. Something is listening between them.</div><div class="meta"><span>WORLD MEMORY ACTIVE</span><span>FATE UNSTABLE</span><span>PATHS UNCOUNTED</span></div><div class="actions"><button class="primary" id="enter">ENTER THE UNKNOWN</button><button id="skip">SKIP INTRO</button></div></main><div class="skip">PHASE 01 // FIRST MOVEMENT</div></div><div id="app"></div><script>const lines=['There are worlds no map has recorded. Something is listening between them.','Civilizations rise. Gods disappear. Doors appear where no door should exist.','Some choices become history. Others become wounds.','Then the boundary fractures. A signal reaches someone who almost stopped moving.','SYSTEM INITIALIZATION.','What happens next is not predetermined.'];let i=0;const story=document.getElementById('story');const cinema=document.getElementById('cinema');let timer=setInterval(()=>{i++;if(i<lines.length){story.style.opacity='0';setTimeout(()=>{story.textContent=lines[i];story.style.opacity='1'},260)}else clearInterval(timer)},2200);function enter(){clearInterval(timer);cinema.classList.add('gone');setTimeout(()=>cinema.remove(),950)}document.getElementById('enter').onclick=enter;document.getElementById('skip').onclick=enter;addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='Escape')enter()});</script><script type="module" src="./v06-world.js"></script></body></html>
